    <!-- Three families, three jobs. Newsreader replaces Cormorant Garamond as the
         display serif: it reads as a research publication rather than an invitation,
         and it is rationed to two appearances on the page. Outfit is dropped — it
         was loaded but never used. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <body class="bg-paper text-ink relative font-sans">
    <!-- Global grain. Preserved from the original build: it is what stops the flat
         tonal fields from reading as vector art. Slightly finer and lighter than
         before so it survives on the near-white surfaces without dirtying them. -->
    <svg class="fixed inset-0 w-full h-full pointer-events-none z-[9999] opacity-[0.028] md:opacity-[0.042]" aria-hidden="true">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>
